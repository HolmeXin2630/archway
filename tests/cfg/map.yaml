# =============================================================================
# Map Configuration
# =============================================================================
# Example map configuration for Archway framework.
# Format: views -> <view_name> -> regions -> <target_name> -> base, size
# =============================================================================

views:
  core0:
    regions:
      uart0:
        base: 0x80000000
        size: 0x1000
      spi0:
        base: 0x80001000
        size: 0x1000
  core1:
    regions:
      uart0:
        base: 0x40000000
        size: 0x1000
      uart1:
        base: 0x40001000
        size: 0x1000
